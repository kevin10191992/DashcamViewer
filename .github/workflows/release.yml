name: Build & Release Portable App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Crear GitHub Release automáticamente'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias npm
        run: npm ci

      - name: ⬇️ Descargar FFmpeg estático para Windows
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          $zipPath = "$env:TEMP\ffmpeg.zip"
          Write-Host "Descargando FFmpeg estático..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zipPath -UseBasicParsing
          Write-Host "Extrayendo FFmpeg..."
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg_ext" -Force
          $ffmpegExe = (Get-ChildItem -Path "$env:TEMP\ffmpeg_ext" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1).FullName
          Copy-Item -Path $ffmpegExe -Destination "bin\ffmpeg.exe" -Force
          Write-Host "FFmpeg copiado con éxito a bin\ffmpeg.exe"

      - name: 🔨 Compilar Ejecutable Portable (.EXE)
        run: npm run build:portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗜️ Empaquetar archivos desempaquetados en ZIP para Release
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -like "refs/*") { $ver = "v1.0.0" }
          $zipFileName = "D026-Dashcam-Viewer-$ver-Windows-Portable.zip"
          Compress-Archive -Path "dist\win-unpacked\*" -DestinationPath "dist\$zipFileName" -Force
          Write-Host "Archivo zip con archivos desempaquetados creado: dist\$zipFileName"
          echo "ZIP_NAME=$zipFileName" >> $env:GITHUB_ENV

      - name: 📤 Subir Artefactos de la Compilación
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME || 'D026-Dashcam-Viewer-Portable' }}
          path: |
            dist/*.zip
            dist/D026-Dashcam-Viewer-Portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: 🚀 Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/D026-Dashcam-Viewer-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
